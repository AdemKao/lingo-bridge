[package]
name = "lingo-speech"
version.workspace = true
edition.workspace = true
description = "Offline speech utterance segmentation, and opt-in sherpa-onnx STT/TTS smoke tests"

[features]
default = []
sherpa = ["dep:sherpa-onnx", "dep:serde_json"]

[dependencies]
sherpa-onnx = { version = "2.0.1", optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "lingo-speech-smoke"
path = "src/bin/smoke.rs"
required-features = ["sherpa"]
