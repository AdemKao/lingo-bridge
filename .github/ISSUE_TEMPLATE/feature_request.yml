name: Feature request
description: Suggest a specific product, platform or documentation improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested approach
      description: Include Windows/macOS, Cloud/Local, latency or privacy constraints where helpful.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: How would we verify it?
      description: Describe observable success criteria, especially for real-time audio.
