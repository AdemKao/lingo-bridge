name: Sign and notarize macOS alpha (manual)

# Explicitly requested by repository maintainer after Apple Developer credentials
# have been configured in GitHub Actions secrets. Does not publish a Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notarize:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Apple notarization · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: Apple-Silicon
          - os: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Confirm Apple Developer configuration
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required Apple Developer secret: $key"
              exit 1
            fi
          done
          echo "Apple signing/notarization credentials are configured."

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Generate native app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/icons/icon.png

      - name: Build Developer ID signed and Apple notarized DMG
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Do not set APPLE_SIGNING_IDENTITY="-"; Tauri should infer the
          # Developer ID Application identity from APPLE_CERTIFICATE.
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles dmg

      - name: Verify Developer ID signature and Gatekeeper assessment
        shell: bash
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/Lingo Bridge.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          AUTHORITY="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          echo "$AUTHORITY" | grep -q "Authority=Developer ID Application:"
          spctl --assess --type execute --verbose "$APP"
          test "$(find target/release/bundle/dmg -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1

      - name: Upload notarized DMG for owner validation
        uses: actions/upload-artifact@v6
        with:
          name: lingo-bridge-macos-${{ matrix.label }}-notarized
          retention-days: 14
          if-no-files-found: error
          path: target/release/bundle/dmg/*.dmg
