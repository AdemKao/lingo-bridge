name: Publish versioned alpha installers

# A new VERSION file/number on main is an explicit, reviewable release trigger.
# Does not execute for pull requests or documentation-only edits.
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingo-alpha-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and release eligibility
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: version
        name: Check alpha version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Only alpha prereleases are allowed by this workflow" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          node .github/scripts/check-version.mjs --tag="v$VERSION"
      - name: Ensure tag is not already published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.value }} already exists. Bump VERSION before publishing." >&2
            exit 1
          fi

  package:
    needs: verify
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            bundles: nsis
            extension: exe
          - os: macos-15
            label: macos-arm64
            bundles: dmg
            extension: dmg
          - os: macos-15-intel
            label: macos-x64
            bundles: dmg
            extension: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate platform icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Compile unsigned alpha installer
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - name: Normalize installer filename for public download
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.label }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          COUNT="$(find target/release/bundle -type f -name "*.$EXTENSION" | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one installer; found $COUNT" >&2
            exit 1
          fi
          ASSET="$(find target/release/bundle -type f -name "*.$EXTENSION" | head -n 1)"
          mkdir -p release-package
          cp "$ASSET" "release-package/lingo-bridge-v$VERSION-$PLATFORM.$EXTENSION"
          ls -lh release-package/
      - name: Upload to GitHub Actions for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: lingo-bridge-${{ matrix.label }}
          retention-days: 7
          if-no-files-found: error
          path: release-package/*

  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    name: Publish prerelease for public download
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lingo-bridge-*
          path: release-package
          merge-multiple: true
      - name: Verify assets and SHA-256 hashes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for NAME in windows-x64.exe macos-arm64.dmg macos-x64.dmg; do
            test -s "release-package/lingo-bridge-v$VERSION-$NAME"
          done
          test "$(find release-package -maxdepth 1 -type f | wc -l)" -eq 3
          (cd release-package && sha256sum lingo-bridge-* > SHA256SUMS.txt)
          cat release-package/SHA256SUMS.txt
      - name: Publish alpha prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lingo Bridge v${{ needs.verify.outputs.version }}
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: false
          body_path: docs/releases/v${{ needs.verify.outputs.version }}.md
          files: |
            release-package/*.exe
            release-package/*.dmg
            release-package/SHA256SUMS.txt
          fail_on_unmatched_files: true
