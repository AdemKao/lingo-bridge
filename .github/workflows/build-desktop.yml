name: Build and publish Windows/macOS alpha installers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-desktop.yml"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/package.json"
      - "Cargo.toml"
      - "docs/releases/**"
  pull_request:
    paths:
      - ".github/workflows/build-desktop.yml"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/package.json"
      - "Cargo.toml"
      - "docs/releases/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create an unpublished draft release (manual testing)"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Must match the application version, e.g. v0.1.0-alpha.1"
        required: false
        type: string
        default: "v0.1.0-alpha.1"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check unified application version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure release files and versions match
        run: node .github/scripts/check-version.mjs

  build:
    name: ${{ matrix.label }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            bundles: nsis
          - os: macos-15
            label: macOS-Apple-Silicon
            bundles: dmg
          - os: macos-15-intel
            label: macOS-Intel
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate Tauri app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build native installer (unsigned alpha)
        working-directory: apps/desktop
        env:
          # Ad-hoc signing only; NOT Apple Developer ID signing/notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - name: Upload downloadable installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingo-bridge-${{ matrix.label }}-alpha
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg

  publish-public-alpha:
    name: Publish public GitHub alpha release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve version and existing Release status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node .github/scripts/check-version.mjs
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/$TAG.md" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG exists. Skipping publication instead of overwriting."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists without a matching visible Release" >&2
              exit 1
            fi
          fi
      - name: Download all three platform assets
        if: ${{ steps.release.outputs.exists == 'false' }}
        uses: actions/download-artifact@v4
        with:
          pattern: lingo-bridge-*-alpha
          path: release-assets
          merge-multiple: true
      - name: Verify assets and produce SHA256SUMS
        if: ${{ steps.release.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          cd release-assets
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish public prerelease (unsigned test builds)
        if: ${{ steps.release.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lingo Bridge ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: ${{ steps.release.outputs.notes }}
          overwrite_files: false
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true

  release-draft:
    name: Create unpublished alpha release draft (manual only)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate tag matches application version
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          node .github/scripts/check-version.mjs
          EXPECTED="v$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "Tag must match application version: $EXPECTED" >&2
            exit 1
          fi
      - name: Download all three artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lingo-bridge-*-alpha
          path: release-assets
          merge-multiple: true
      - name: Verify installers and compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          cd release-assets
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
      - name: Create draft pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Lingo Bridge ${{ inputs.release_tag }}
          draft: true
          prerelease: true
          generate_release_notes: false
          body_path: docs/releases/${{ inputs.release_tag }}.md
          overwrite_files: false
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
