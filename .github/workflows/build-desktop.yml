name: Build Windows and macOS desktop installers (alpha)

on:
  push:
    branches:
      - feat/desktop-installers-and-release
  pull_request:
    paths:
      - ".github/workflows/build-desktop.yml"
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create an unpublished draft alpha release after all three installers pass"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Alpha tag, for example v0.1.0-alpha.1 (used only with publish_release)"
        required: false
        type: string
        default: "v0.1.0-alpha.1"

permissions:
  contents: read

concurrency:
  group: desktop-bundles-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            bundles: nsis
          - os: macos-15
            label: macOS-Apple-Silicon
            bundles: dmg
          - os: macos-15-intel
            label: macOS-Intel
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Generate Tauri app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/icons/icon.png

      - name: Build native installer (unsigned alpha)
        working-directory: apps/desktop
        env:
          # Ad-hoc signature only. Not Apple Developer ID signing/notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      - name: Upload downloadable installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingo-bridge-${{ matrix.label }}-alpha
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg

  release-draft:
    name: Create draft GitHub Alpha Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check release tag naming
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Only vMAJOR.MINOR.PATCH-alpha.NUMBER is supported" >&2
            exit 1
          fi

      - name: Download all three artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lingo-bridge-*-alpha
          path: release-assets
          merge-multiple: true

      - name: Verify three installers were generated
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          ls -lh release-assets/

      - name: Create draft prerelease (manual publication required)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Lingo Bridge ${{ inputs.release_tag }}
          draft: true
          prerelease: true
          generate_release_notes: false
          body: |
            **Experimental alpha - not validated for production LINE calls.**
            - Windows x64: .exe (NSIS)
            - macOS Apple Silicon: .dmg
            - macOS Intel: .dmg

            Requires two manually configured virtual audio cables. See docs/audio-routing.md.
            Cloud AI requires a **user-supplied API key**; no keys ship inside installers.
            Local speech STT/TTS tools are separate CLI prototypes, not integrated into desktop live calls.
            Packages are not officially code-signed/notarized. Expect security warnings.
            Test only with informed consent from call participants.
          files: |
            release-assets/*.exe
            release-assets/*.dmg
          fail_on_unmatched_files: true
